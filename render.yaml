# ==========================================================
# Blueprint do Render — Portfólio de vídeos Cetrus
# ==========================================================
#
# Nenhum valor de segredo fica aqui (sync: false = configurar
# manualmente em Render > Environment). Veja o README.md para
# o passo a passo completo de deploy.

services:
  - type: web
    name: portfolio-cetrus
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # "starter" (ou superior) é recomendado: o plano Free
    # "dorme" após inatividade de requisições HTTP, e um lote
    # de processamento roda em thread de fundo sem gerar
    # requisições — o serviço pode ser suspenso no meio de um
    # lote grande. Ajuste conforme o plano da sua conta.
    plan: starter

    healthCheckPath: /health

 
    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: ENABLE_OLLAMA
        value: "false"

      - key: CETRUS_DATA_DIR
        value: /data

      - key: APP_AUTH_ENABLED
        value: "true"

      - key: APP_AUTH_USERNAME
        sync: false

      - key: APP_AUTH_PASSWORD
        sync: false

      - key: APP_AUTH_SESSION_SECRET
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        sync: false

    disk:
      name: cetrus-data
      mountPath: /data
      sizeGB: 1
